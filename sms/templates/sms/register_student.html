
{% extends 'sms/base.html' %}

{% block title %}Register Student | EduTrack{% endblock %}

{% block content %}

<div class="content-card">

    <h2 class="mb-4">Student Registration</h2>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">

                <label class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    <div class="text-danger small">
                        {{ field.errors }}
                    </div>
                {% endif %}

            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">
            Register Student
        </button>

        <a href="{% url 'student_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
