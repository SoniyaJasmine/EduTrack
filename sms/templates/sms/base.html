
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EduTrack SMS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #243b55;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .status-present {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-absent {
            background: #f8d7da;
            color: #842029;
        }

        .status-late {
            background: #fff3cd;
            color: #664d03;
        }

        .stat-card {
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            font-weight: bold;
        }

        .table th {
            white-space: nowrap;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">

    <a class="navbar-brand" href="{% url 'batch_list' %}">
        EduTrack SMS
    </a>

    <div class="ms-auto d-flex gap-2 flex-wrap">

        <a href="{% url 'student_list' %}"
           class="btn btn-outline-light btn-sm">
            Students
        </a>

        <a href="{% url 'batch_list' %}"
           class="btn btn-outline-light btn-sm">
            Batches
        </a>

        <a href="{% url 'register_student' %}"
           class="btn btn-light btn-sm">
            Register Student
        </a>

    </div>

</nav>

<div class="main-container">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
